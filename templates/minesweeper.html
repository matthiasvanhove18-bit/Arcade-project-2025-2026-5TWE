<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>High Scores - Minesweeper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <a href="/" class="terug-knop">⬅ Terug naar Home</a>

    <div class="highscore-omhulsel">
        <h1 class="pagina-titel">High Scores</h1>

        <div class="score-houder">
            <div class="score-kop">
                <span>RANG</span>
                <span>NAAM</span>
            </div>
            
            <div class="score-inhoud">
    {% if scores %}
        <table style="width:100%; color: white; border-collapse: collapse;">
            {% for s in scores %}
            <tr style="border-bottom: 1px solid #2d2d44;">
                <td style="padding: 15px;">{{ s.rang }}</td>
                <td style="padding: 15px;">{{ s.naam }}</td>
                <td style="padding: 15px; color: #4db8ff;">{{ s.score }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>NOG GEEN SCORES BESCHIKBAAR</p>
    {% endif %}
</div>
            </div>
        </div>
    </div>

</body>
</html>
